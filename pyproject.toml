[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42", "wheel"]

[project]
authors = [
  {name = "Konstantin Fadeev", email = "jredkiy@yandex.ru"}
]
classifiers = [
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3"
]
dependencies = [
  'Flask>=2.0.3',
  'PyYAML>=6.0.3',
  'marshmallow>=4.0.0',
  'Schema-First>=0.16.3'
]
description = "Flask extension for using 'specification first' or 'API-first' principle via OpenAPI specification."
license = {file = "LICENSE"}
name = "Flask-First"
readme = "README.md"
requires-python = ">=3.12"
version = "0.90.0"

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "mypy==2.3.0",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "python-dotenv==1.2.2",
  "tox==4.59.0",
  "twine==6.2.0"
]

[project.urls]
changelog = "https://github.com/flask-pro/flask-first/blob/master/CHANGES.md"
repository = "https://github.com/flask-pro/flask-first"

[tool.black]
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/foo.py  # exclude a file named foo.py in the root of the project (in addition to the defaults)
'''
include = '\.pyi?$'
line-length = 100
skip-string-normalization = true
target-version = ['py312']

[tool.setuptools.packages.find]
include = ["flask_first*"]
where = ["src"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    env_list =
        py314
        py313
        py312
    [testenv]
    extras = dev
    commands = pytest -s -x --cov-report term-missing:skip-covered --cov=../src/flask_first tests/
"""
